<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BACK-GROUND-HERO</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #f0f0f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  
  .main-screen {
    padding: 20px;
    height: calc(100vh - 150px);
    box-sizing: border-box;
  }

  #game-container {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 150px;
    background-color: #1e1e1e;
    color: white;
    display: flex;
    flex-direction: column;
    border-top: 4px solid #444;
  }

  #ui-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #333;
    padding: 5px 15px;
    font-size: 13px;
    border-bottom: 2px solid #444;
    flex-wrap: wrap;
  }

  /* ボタンが入り切らない時のために少し調整 */
  #ui-bar > div {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  .btn {
    background-color: #555;
    color: white;
    border: 1px solid #777;
    padding: 2px 8px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 3px;
  }
  
  .btn:hover { background-color: #777; }
  
  .btn-spawn {
    background-color: #2980b9;
    border-color: #3498db;
  }
  .btn-spawn:hover { background-color: #3498db; }

  .btn-gacha {
    background-color: #e6b800;
    color: #111;
    border-color: #fff;
    font-weight: bold;
  }
  .btn-gacha:hover { background-color: #ffcc00; }

  .btn-reset {
    background-color: #d63031;
    color: white;
    border: none;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 15px;
  }
  .btn-reset:hover { background-color: #ff7675; }

  #equip-bar {
    background-color: #222;
    padding: 2px 15px;
    font-size: 12px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #444;
  }

  #battle-field {
    position: relative;
    flex-grow: 1;
    overflow: hidden;
    background: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" fill="%23222"/><rect width="20" height="20" fill="%232a2a2a"/><rect x="20" y="20" width="20" height="20" fill="%232a2a2a"/></svg>') repeat;
  }

  .entity {
    position: absolute;
    bottom: 20px;
    width: 32px;
    height: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    border-radius: 4px;
  }

  #hero {
    left: 50px;
    background-color: #4CAF50;
    box-shadow: 0 0 10px #4CAF50;
  }

  .enemy {
    background-color: #F44336;
    box-shadow: 0 0 10px #F44336;
  }

  .hp-bar-container {
    position: absolute;
    top: -10px;
    left: -4px;
    width: 40px;
    height: 5px;
    background-color: black;
    border: 1px solid #777;
  }

  .hp-bar {
    height: 100%;
    background-color: #00ff00;
    width: 100%;
  }

  .enemy .hp-bar { background-color: #ff3333; }

  .damage-text {
    position: absolute;
    color: #ffcc00;
    font-weight: bold;
    font-size: 14px;
    pointer-events: none;
    animation: floatUp 0.8s forwards;
  }

  .gacha-result {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
    pointer-events: none;
    animation: popInOut 2s forwards;
    z-index: 10;
  }

  #save-toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #2ecc71;
    color: white;
    padding: 8px 15px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-30px); opacity: 0; }
  }
  @keyframes popInOut {
    0% { transform: translate(-50%, 20px) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, 0) scale(1.2); opacity: 1; }
    80% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -20px) scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<div class="main-screen">
  <h2>アップデートのお知らせ 2026/07/14</h2>
  <p>自己回復力（Regen）強化機能を追加しました！</p>
  <p style="color: #27ae60; font-weight: bold; font-size: 14px;">✓ 非戦闘時のHP回復スピードを上げられるようになりました</p>
  <p>0.22.2</p>
  
  <button class="btn-reset" onclick="resetGame()">データを削除して最初からやり直す</button>
</div>

<div id="save-toast">セーブ完了 💾</div>

<div id="game-container">
  <div id="ui-bar">
    <div>
      <span>Lv:<span id="val-lvl">1</span></span> | 
      <span>EXP:<span id="val-exp">0</span>/<span id="val-maxexp">10</span></span> | 
      <span>Gold:<span id="val-gold">0</span>G</span>
    </div>
    <div>
      <span>HP:<span id="val-hp">100</span>/<span id="val-maxhp">100</span></span> | 
      <span>ATK:<span id="val-atk">10</span></span> |
      <span>DEF:<span id="val-def">0</span></span> |
      <span>Regen:<span id="val-regen">5</span>/s</span>
    </div>
    <div>
      <button class="btn" onclick="upgradeAtk()">ATK (<span id="cost-atk">10</span>G)</button>
      <button class="btn" onclick="upgradeHp()">HP (<span id="cost-hp">10</span>G)</button>
      <button class="btn" onclick="upgradeDef()">DEF (<span id="cost-def">10</span>G)</button>
      <button class="btn" onclick="upgradeRegen()">回復 (<span id="cost-regen">10</span>G)</button>
      <button class="btn btn-spawn" onclick="upgradeSpawn()">出現率 Lv<span id="val-spawn-lvl">1</span> (<span id="cost-spawn">30</span>G)</button>
      <button class="btn btn-gacha" onclick="pullGacha()">武器ガチャ (<span id="cost-gacha">200</span>G)</button>
    </div>
  </div>
  <div id="equip-bar">
    <span>現在の武器: <strong id="val-equip-name" style="color: white;">素手</strong> (ATK +<span id="val-equip-atk">0</span>)</span>
    <span>総ATK: <strong id="val-total-atk" style="color: #ff9999;">10</strong></span>
  </div>
  <div id="battle-field">
    <div id="hero" class="entity">
      H
      <div class="hp-bar-container"><div class="hp-bar" id="hero-hp-bar"></div></div>
    </div>
  </div>
</div>

<script>
  const state = {
    gold: 0,
    lvl: 1,
    exp: 0,
    maxExp: 10,
    // ★ baseRegen（1秒あたりの自然回復量）を追加
    hero: { maxHp: 100, hp: 100, baseAtk: 10, baseDef: 0, baseRegen: 5, x: 50, speed: 1.5, attackCooldown: 0 },
    weapon: { name: "素手", atkBonus: 0, color: "white" },
    // ★ regenCostを追加
    upgrades: { atkCost: 10, hpCost: 10, defCost: 10, regenCost: 10, spawnLvl: 1, spawnCost: 30, gachaCost: 200 },
    enemies: [],
    spawnTimer: 0,
    saveTimer: 0
  };

  const battleField = document.getElementById('battle-field');
  const heroEl = document.getElementById('hero');
  const heroHpBar = document.getElementById('hero-hp-bar');

  function getTotalAtk() { return state.hero.baseAtk + state.weapon.atkBonus; }

  function getSpawnInterval() {
    const interval = 1.6 - (state.upgrades.spawnLvl * 0.1);
    return Math.max(0.3, interval); 
  }

  function saveGame(showNotification = false) {
    const saveData = {
      gold: state.gold, lvl: state.lvl, exp: state.exp, maxExp: state.maxExp,
      hero: { 
        maxHp: state.hero.maxHp, 
        hp: state.hero.hp, 
        baseAtk: state.hero.baseAtk, 
        baseDef: state.hero.baseDef,
        baseRegen: state.hero.baseRegen // ★ 保存対象に追加
      },
      weapon: state.weapon, upgrades: state.upgrades
    };
    localStorage.setItem('taskbar_hero_save_data', JSON.stringify(saveData));

    if (showNotification && !document.hidden) {
      const toast = document.getElementById('save-toast');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 1000);
    }
  }

  function loadGame() {
    const savedData = localStorage.getItem('taskbar_hero_save_data');
    if (!savedData) return;
    try {
      const data = JSON.parse(savedData);
      state.gold = data.gold ?? 0;
      state.lvl = data.lvl ?? 1;
      state.exp = data.exp ?? 0;
      state.maxExp = data.maxExp ?? 10;
      if (data.hero) {
        state.hero.maxHp = data.hero.maxHp ?? 100;
        state.hero.hp = data.hero.hp ?? data.hero.maxHp;
        state.hero.baseAtk = data.hero.baseAtk ?? 10;
        state.hero.baseDef = data.hero.baseDef ?? 0;
        state.hero.baseRegen = data.hero.baseRegen ?? 5; // ★ 古いデータの互換性対応（初期値5）
      }
      if (data.weapon) state.weapon = data.weapon;
      if (data.upgrades) {
        state.upgrades = data.upgrades;
        if (state.upgrades.spawnLvl === undefined) state.upgrades.spawnLvl = 1;
        if (state.upgrades.spawnCost === undefined) state.upgrades.spawnCost = 30;
        if (state.upgrades.defCost === undefined) state.upgrades.defCost = 10;
        if (state.upgrades.regenCost === undefined) state.upgrades.regenCost = 10; // ★ 互換性対応
      }
    } catch (e) { console.error(e); }
  }

  window.resetGame = () => {
    if (confirm("これまでの進捗、ゴールド、武器がすべて消去されます。本当に最初からやり直しますか？")) {
      localStorage.removeItem('taskbar_hero_save_data');
      location.reload();
    }
  };

  function updateUI() {
    document.getElementById('val-lvl').innerText = state.lvl;
    document.getElementById('val-exp').innerText = Math.floor(state.exp);
    document.getElementById('val-maxexp').innerText = state.maxExp;
    document.getElementById('val-gold').innerText = Math.floor(state.gold);
    document.getElementById('val-hp').innerText = Math.floor(state.hero.hp);
    document.getElementById('val-maxhp').innerText = state.hero.maxHp;
    document.getElementById('val-atk').innerText = state.hero.baseAtk;
    document.getElementById('val-def').innerText = state.hero.baseDef;
    document.getElementById('val-regen').innerText = state.hero.baseRegen; // ★ UI反映
    
    document.getElementById('cost-atk').innerText = state.upgrades.atkCost;
    document.getElementById('cost-hp').innerText = state.upgrades.hpCost;
    document.getElementById('cost-def').innerText = state.upgrades.defCost;
    document.getElementById('cost-regen').innerText = state.upgrades.regenCost; // ★ UI反映
    
    const isMaxSpawn = state.upgrades.spawnLvl >= 12;
    document.getElementById('val-spawn-lvl').innerText = isMaxSpawn ? "MAX" : state.upgrades.spawnLvl;
    document.getElementById('cost-spawn').innerText = isMaxSpawn ? "--" : state.upgrades.spawnCost;

    document.getElementById('cost-gacha').innerText = state.upgrades.gachaCost;

    const equipNameEl = document.getElementById('val-equip-name');
    equipNameEl.innerText = state.weapon.name;
    equipNameEl.style.color = state.weapon.color;
    document.getElementById('val-equip-atk').innerText = state.weapon.atkBonus;
    document.getElementById('val-total-atk').innerText = getTotalAtk();

    heroHpBar.style.width = (state.hero.hp / state.hero.maxHp * 100) + '%';
  }

  window.pullGacha = () => {
    if (state.gold < state.upgrades.gachaCost) return;
    state.gold -= state.upgrades.gachaCost;
    state.upgrades.gachaCost = Math.floor(state.upgrades.gachaCost * 1.5);
    
    const roll = Math.random();
    let rarity, color, minAtk, maxAtk, prefix;
    if (roll < 0.05) { rarity = "Legendary"; color = "#ffd700"; minAtk = 50; maxAtk = 150; prefix = ["神の", "滅びの", "伝説の"]; }
    else if (roll < 0.20) { rarity = "Epic"; color = "#da70d6"; minAtk = 20; maxAtk = 49; prefix = ["魔王の", "血塗られた", "覇者の"]; }
    else if (roll < 0.50) { rarity = "Rare"; color = "#4169e1"; minAtk = 8; maxAtk = 19; prefix = ["鋼鉄の", "鋭い", "騎士の"]; }
    else { rarity = "Common"; color = "#a9a9a9"; minAtk = 1; maxAtk = 7; prefix = ["ボロボロの", "木の", "普通の"]; }

    const weapons = ["剣", "斧", "槍", "ダガー"];
    const name = prefix[Math.floor(Math.random() * prefix.length)] + weapons[Math.floor(Math.random() * weapons.length)];
    const bonus = Math.floor(Math.random() * (maxAtk - minAtk + 1)) + minAtk;

    let resultMsg = "";
    if (bonus > state.weapon.atkBonus) {
      state.weapon = { name: name, atkBonus: bonus, color: color };
      resultMsg = `✨ ${name} (ATK+${bonus}) を手に入れた！`;
    } else {
      resultMsg = `🗑️ ${name} (ATK+${bonus}) は弱かったので捨てた...`;
    }
    showGachaResult(resultMsg, color);
    updateUI(); saveGame();
  };

  function showGachaResult(text, color) {
    if (document.hidden) return;
    const el = document.createElement('div');
    el.className = 'gacha-result'; el.innerText = text; el.style.color = color;
    battleField.appendChild(el); setTimeout(() => el.remove(), 2000);
  }

  window.upgradeAtk = () => {
    if (state.gold >= state.upgrades.atkCost) {
      state.gold -= state.upgrades.atkCost; state.hero.baseAtk += 2;
      state.upgrades.atkCost = Math.floor(state.upgrades.atkCost * 1.5); 
      updateUI(); saveGame();
    }
  };

  window.upgradeHp = () => {
    if (state.gold >= state.upgrades.hpCost) {
      state.gold -= state.upgrades.hpCost; state.hero.maxHp += 20;
      state.hero.hp = state.hero.maxHp; state.upgrades.hpCost = Math.floor(state.upgrades.hpCost * 1.5); 
      updateUI(); saveGame();
    }
  };

  window.upgradeDef = () => {
    if (state.gold >= state.upgrades.defCost) {
      state.gold -= state.upgrades.defCost; 
      state.hero.baseDef += 1;
      state.upgrades.defCost = Math.floor(state.upgrades.defCost * 1.5); 
      updateUI(); saveGame();
    }
  };

  // ★ 自己回復力（Regen）の強化関数
  window.upgradeRegen = () => {
    if (state.gold >= state.upgrades.regenCost) {
      state.gold -= state.upgrades.regenCost;
      state.hero.baseRegen += 2; // 1回の強化で毎秒の回復量が+2
      state.upgrades.regenCost = Math.floor(state.upgrades.regenCost * 1.5);
      updateUI(); saveGame();
    }
  };

  window.upgradeSpawn = () => {
    if (state.upgrades.spawnLvl >= 12) return; 
    if (state.gold >= state.upgrades.spawnCost) {
      state.gold -= state.upgrades.spawnCost;
      state.upgrades.spawnLvl += 1;
      state.upgrades.spawnCost = Math.floor(state.upgrades.spawnCost * 1.8);
      updateUI(); saveGame();
    }
  };

  function showDamage(x, damage) {
    if (document.hidden) return;
    const el = document.createElement('div');
    el.className = 'damage-text'; el.innerText = Math.floor(damage);
    el.style.left = x + 'px'; el.style.bottom = '50px';
    battleField.appendChild(el); setTimeout(() => el.remove(), 800);
  }

  function tickGame(dt) {
    state.saveTimer += dt;
    if (state.saveTimer > 5) { saveGame(true); state.saveTimer = 0; }

    state.spawnTimer += dt;
    if (state.spawnTimer > getSpawnInterval() && state.enemies.length < 8) {
      const isBoss = Math.random() < 0.1;
      const multiplier = 1 + (state.lvl * 0.3);
      state.enemies.push({
        hp: (isBoss ? 80 : 25) * multiplier,
        maxHp: (isBoss ? 80 : 25) * multiplier,
        atk: (isBoss ? 8 : 3) * multiplier,
        x: window.innerWidth > 0 ? window.innerWidth : 1000,
        speed: 1.2,
        goldDrop: (isBoss ? 25 : 5) * state.lvl, 
        expDrop: (isBoss ? 10 : 2) * state.lvl,
        attackCooldown: 0,
        isBoss: isBoss
      });
      state.spawnTimer = 0;
    }

    let isFighting = false;
    const combatDistance = 35;
    const renderWidth = window.innerWidth > 0 ? window.innerWidth : 1000;

    if (state.enemies.length > 0) {
      const frontEnemy = state.enemies[0];
      const dist = frontEnemy.x - state.hero.x;
      
      if (dist <= combatDistance) {
        isFighting = true;
        state.hero.attackCooldown -= dt;
        frontEnemy.attackCooldown -= dt;

        if (state.hero.attackCooldown <= 0) {
          frontEnemy.hp -= getTotalAtk();
          showDamage(frontEnemy.x, getTotalAtk());
          state.hero.attackCooldown = 0.5;
        }

        if (frontEnemy.hp > 0 && frontEnemy.attackCooldown <= 0) {
          const takenDamage = Math.max(1, frontEnemy.atk - state.hero.baseDef);
          state.hero.hp -= takenDamage;
          showDamage(state.hero.x, takenDamage);
          frontEnemy.attackCooldown = 0.8;
        }

        if (frontEnemy.hp <= 0) {
          state.gold += frontEnemy.goldDrop;
          state.exp += frontEnemy.expDrop;
          state.enemies.shift();
          isFighting = false;
          
          if (state.exp >= state.maxExp) {
            state.lvl++; state.exp -= state.maxExp;
            state.maxExp = Math.floor(state.maxExp * 1.5);
            state.hero.maxHp += 15; state.hero.hp = state.hero.maxHp;
            state.hero.baseAtk += 1;
            
            const levelUpReward = state.lvl * 50; 
            state.gold += levelUpReward;
            
            if (!document.hidden) {
              showDamage(state.hero.x, levelUpReward);
            }
            saveGame();
          }
        }

        if (state.hero.hp <= 0) {
          state.hero.hp = state.hero.maxHp; state.hero.x = 10;
        }
      }
    }

    if (!isFighting) {
      state.hero.x += state.hero.speed * 60 * dt; 
      if (state.hero.x > renderWidth / 3) {
        state.hero.x = renderWidth / 3;
        state.enemies.forEach(e => { e.x -= state.hero.speed * 60 * dt; });
      }
    }

    state.enemies.forEach((e, index) => {
      let targetX = state.hero.x + combatDistance;
      if (index > 0) targetX = state.enemies[index - 1].x + 40;
      if (e.x > targetX) e.x -= e.speed * 60 * dt;
    });
    
    // ★ ここを強化したRegen値（baseRegen）に基づく回復量に変更
    if (!isFighting && state.hero.hp < state.hero.maxHp) {
      // 最大HPを超えないようにMath.minで制限をかける
      state.hero.hp = Math.min(state.hero.hp + state.hero.baseRegen * dt, state.hero.maxHp);
    }
  }

  function syncEnemyDOM() {
    if (document.hidden) return;
    const existingElements = battleField.querySelectorAll('.enemy');
    existingElements.forEach(el => el.remove());

    state.enemies.forEach(enemy => {
      const el = document.createElement('div');
      el.className = 'entity enemy';
      if(enemy.isBoss) {
        el.style.width = '40px'; el.style.height = '40px';
        el.style.backgroundColor = '#9C27B0'; el.style.boxShadow = '0 0 10px #9C27B0';
        el.innerText = 'B';
      } else { el.innerText = 'E'; }
      el.style.left = enemy.x + 'px';
      
      const hpContainer = document.createElement('div'); hpContainer.className = 'hp-bar-container';
      const hpBar = document.createElement('div'); hpBar.className = 'hp-bar';
      hpBar.style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + '%';
      hpContainer.appendChild(hpBar); el.appendChild(hpContainer);
      
      battleField.appendChild(el);
    });
  }

  const workerCode = `
    let lastTime = Date.now();
    setInterval(() => {
      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      postMessage(dt);
    }, 1000 / 60);
  `;
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const worker = new Worker(URL.createObjectURL(blob));

  worker.onmessage = function(e) {
    let dt = e.data;
    if (dt > 0.1) dt = 0.1;

    tickGame(dt);

    if (!document.hidden) {
      heroEl.style.left = state.hero.x + 'px';
      syncEnemyDOM();
      updateUI();
    }
  };

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { updateUI(); syncEnemyDOM(); }
  });

  loadGame();
  updateUI();

</script>
</body>
</html>
