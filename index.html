<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube ループ＆再生リスト</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 900px; width: 100%; padding-bottom: 100px; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
    
    /* 入力エリア */
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input[type="text"], input[type="number"] {
      padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #1f1f1f; color: #fff; font-size: 0.95rem;
    }
    input[type="text"] { flex: 1; min-width: 200px; }
    input[type="number"] { width: 90px; text-align: center; }
    
    button {
      padding: 12px 20px; border-radius: 8px; border: none;
      background: #ff0000; color: #fff; font-weight: bold;
      cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    button:hover { background: #cc0000; }
    .btn-secondary { background: #333; }
    .btn-secondary:hover { background: #444; }
    .btn-small { padding: 6px 12px; font-size: 0.85rem; }
    .btn-green { background: #2ea043; }
    .btn-green:hover { background: #238636; }

    /* プレイヤーエリア */
    .player-container {
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .player-wrapper {
      position: relative; padding-top: 56.25%;
      background: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .player-wrapper iframe, .player-wrapper #player {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }

    /* ミニプレイヤー状態 */
    .player-container.floating {
      position: fixed; bottom: 20px; right: 20px;
      width: 350px; z-index: 1000;
    }
    .player-container.floating .player-wrapper {
      padding-top: 56.25%; border: 2px solid #3ea6ff;
    }

    /* 統計エリア */
    .stats-card {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
      background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 15px;
    }
    .stat-box { text-align: center; }
    .stat-label { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #3ea6ff; }
    .controls { display: flex; justify-content: space-between; margin-bottom: 30px; align-items: center; }

    /* セクション共通 */
    .section-card {
      background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 20px;
    }
    .section-card h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }

    /* 再生リスト & ドラッグ＆ドロップ用スタイル */
    .playlist { list-style: none; padding: 0; margin: 0; }
    .playlist-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f0f0f; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
      border-left: 4px solid transparent; flex-wrap: wrap; gap: 10px;
      cursor: grab; /* つかめるアイコン */
      transition: transform 0.2s, background 0.2s;
    }
    .playlist-item:active { cursor: grabbing; } /* つかんでいる最中 */
    
    /* ドラッグ中のスタイル */
    .playlist-item.dragging {
      opacity: 0.5;
      background: #222;
      border: 1px dashed #aaa;
    }
    /* ドロップ位置を示す線 */
    .playlist-item.drag-over {
      border-top: 2px solid #3ea6ff;
    }

    .playlist-item.active { border-left-color: #3ea6ff; background: #2a2a2a; }
    
    /* ドラッグ用のハンドル（左側のアイコン） */
    .drag-handle {
      color: #666; font-size: 1.2rem; margin-right: 10px; cursor: grab;
      user-select: none;
    }
    .playlist-item:active .drag-handle { cursor: grabbing; }

    .playlist-info { flex: 1; min-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; display: flex; align-items: center;}
    .playlist-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .loop-badge { background: #333; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; color: #aaa; display: flex; align-items: center; }
    .loop-badge.active-badge { background: #3ea6ff; color: #000; font-weight: bold; }
    
    .inline-loop-input {
      width: 50px; padding: 2px 4px; margin: 0 5px;
      border-radius: 4px; border: none; text-align: center;
      background: #fff; color: #000; font-weight: bold; font-size: 0.9rem;
    }

    /* 検索結果 */
    .search-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .result-item { background: #0f0f0f; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .result-thumbnail { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .result-info { padding: 10px; flex: 1; }
    .result-title { font-size: 0.9rem; margin: 0 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .result-actions { padding: 10px; display: flex; gap: 5px; background: #1a1a1a; }
    .result-actions button { flex: 1; padding: 8px; font-size: 0.8rem; }
    .loading-text { text-align: center; color: #aaa; display: none; }

    @media (max-width: 600px) {
      .stats-card { grid-template-columns: 1fr; }
      .player-container.floating { width: 250px; bottom: 10px; right: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube 自動ループ＆再生リスト</h1>
    
    <div class="input-group">
      <input type="text" id="directInput" placeholder="URLまたは検索キーワードを入力" />
      <button onclick="handleInput()">単体再生 / 検索</button>
    </div>

    <div id="playerContainer" class="player-container">
      <div class="player-wrapper">
        <div id="player"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-secondary" onclick="toggleMiniPlayer()">📺 ミニプレイヤー切替</button>
      <div style="font-size: 0.8rem; color: #aaa;">※別窓PiPは動画上で右クリック2回</div>
    </div>

    <div class="stats-card">
      <div class="stat-box">
        <div class="stat-label">現在の動画ループ</div>
        <div class="stat-value" id="currentVideoLoop">0 / 0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">総ループ回数</div>
        <div class="stat-value" id="loopCount">0 回</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">合計再生時間</div>
        <div class="stat-value" id="totalTime">00:00:00</div>
      </div>
    </div>

    <div class="controls" style="justify-content: flex-end;">
      <button class="btn-secondary btn-small" onclick="resetStats()">カウンターリセット</button>
    </div>

    <div class="section-card">
      <h2>📝 再生リスト (ドラッグで並び替えできます)</h2>
      <div class="input-group" style="margin-bottom: 15px;">
        <input type="text" id="listUrlInput" placeholder="追加するYouTube URL" />
        <input type="number" id="listLoopInput" value="3" min="1" title="追加時のループ回数" />
        <button class="btn-green" onclick="addUrlToPlaylist()">＋ リストに追加</button>
      </div>
      <ul id="playlistUI" class="playlist">
        <li style="color: #aaa; padding: 10px;">リストは空です。検索結果やURLから追加してください。</li>
      </ul>
      <div style="margin-top: 15px; text-align: right;">
        <button onclick="startPlaylist()" id="btnStartPlaylist" style="display: none;">▶ リストを最初から再生</button>
      </div>
    </div>

    <div class="section-card">
      <h2>🔍 動画検索結果</h2>
      <div id="loadingText" class="loading-text">検索中...</div>
      <div id="searchResults" class="search-results">
        <p style="color: #aaa; grid-column: 1 / -1;">上の入力欄からキーワード検索できます。</p>
      </div>
    </div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyAIQz4iVeHbZcE8R7Jh2nkLXpJaRY-Z_00'; 

    let player, timerInterval = null;
    let loopCount = 0, totalSeconds = 0;
    let currentVideoId = 'dQw4w9WgXcQ';
    
    let playlist = []; 
    let isPlaylistMode = false;
    let currentPlaylistIndex = 0;
    let isMiniPlayer = false;
    
    // ドラッグ＆ドロップ用変数
    let draggedIndex = null;

    function loadSavedData() {
      const savedLoopCount = localStorage.getItem('ytLoop_loopCount');
      const savedTotalTime = localStorage.getItem('ytLoop_totalSeconds');
      const savedPlaylist = localStorage.getItem('ytLoop_playlist');
      
      if (savedLoopCount) loopCount = parseInt(savedLoopCount, 10);
      if (savedTotalTime) totalSeconds = parseInt(savedTotalTime, 10);
      if (savedPlaylist) playlist = JSON.parse(savedPlaylist);

      document.getElementById('loopCount').innerText = `${loopCount} 回`;
      updateTimeDisplay();
      renderPlaylistUI();
    }
    loadSavedData();

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      const originStr = (window.location.origin === "null" || !window.location.origin) ? "http://localhost" : window.location.origin;
      player = new YT.Player('player', {
        videoId: currentVideoId,
        host: 'https://www.youtube.com',
        playerVars: { 'playsinline': 1, 'rel': 0, 'origin': originStr },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) startTimer();
      else stopTimer();

      if (event.data === YT.PlayerState.ENDED) {
        loopCount++;
        document.getElementById('loopCount').innerText = `${loopCount} 回`;
        localStorage.setItem('ytLoop_loopCount', loopCount);

        if (isPlaylistMode && playlist.length > 0) {
          let currentItem = playlist[currentPlaylistIndex];
          currentItem.currentLoops++;
          
          if (currentItem.currentLoops >= currentItem.targetLoops) {
            currentItem.currentLoops = 0; 
            currentPlaylistIndex++;
            if (currentPlaylistIndex >= playlist.length) currentPlaylistIndex = 0; 
            playPlaylistItem(currentPlaylistIndex);
          } else {
            player.seekTo(0, true);
            player.playVideo();
            updateCurrentLoopDisplay();
            renderPlaylistUI(); 
          }
        } else {
          player.seekTo(0, true);
          player.playVideo();
          updateCurrentLoopDisplay(true); 
        }
      }
    }

    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          totalSeconds++;
          updateTimeDisplay();
          localStorage.setItem('ytLoop_totalSeconds', totalSeconds);
        }, 1000);
      }
    }
    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }
    function updateTimeDisplay() {
      const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      document.getElementById('totalTime').innerText = `${h}:${m}:${s}`;
    }
    function resetStats() {
      loopCount = 0; totalSeconds = 0;
      document.getElementById('loopCount').innerText = '0 回';
      updateTimeDisplay();
      localStorage.setItem('ytLoop_loopCount', 0);
      localStorage.setItem('ytLoop_totalSeconds', 0);
    }
    function updateCurrentLoopDisplay(isInfinite = false) {
      const display = document.getElementById('currentVideoLoop');
      if (isInfinite || !isPlaylistMode || playlist.length === 0) {
        display.innerText = "無限ループ中";
        display.style.color = "#aaa";
      } else {
        const item = playlist[currentPlaylistIndex];
        display.innerText = `${item.currentLoops} / ${item.targetLoops} 回`;
        display.style.color = "#3ea6ff";
      }
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function addUrlToPlaylist() {
      const url = document.getElementById('listUrlInput').value.trim();
      const loops = parseInt(document.getElementById('listLoopInput').value, 10);
      const videoId = extractVideoId(url);
      
      if (!videoId) { alert("有効なYouTube URLを入力してください。"); return; }
      if (loops < 1) { alert("ループ回数は1以上にしてください。"); return; }

      addToPlaylistData(videoId, `動画ID: ${videoId}`, loops);
      document.getElementById('listUrlInput').value = '';
    }

    function addToPlaylistData(videoId, title, targetLoops) {
      playlist.push({ videoId: videoId, title: title, targetLoops: targetLoops, currentLoops: 0 });
      savePlaylist();
      renderPlaylistUI();
    }

    function removePlaylistItem(index) {
      playlist.splice(index, 1);
      // 再生中のアイテムが削除された場合などのインデックス調整
      if (currentPlaylistIndex >= playlist.length) currentPlaylistIndex = 0;
      savePlaylist();
      renderPlaylistUI();
    }

    function updateItemLoop(index, newValue) {
      const num = parseInt(newValue, 10);
      if (num >= 1) {
        playlist[index].targetLoops = num;
        savePlaylist();
        updateCurrentLoopDisplay();
        renderPlaylistUI(); 
      }
    }

    function savePlaylist() {
      localStorage.setItem('ytLoop_playlist', JSON.stringify(playlist));
    }

    // --- ドラッグ＆ドロップ処理関数群 ---
    function handleDragStart(e, index) {
      draggedIndex = index;
      // 見た目のフィードバックを少し遅らせる（ドラッグ開始直後にクラスを付与）
      setTimeout(() => e.target.classList.add('dragging'), 0);
      // データ転送（今回は使用しませんが、ドラッグ動作に必須な場合があります）
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e, index) {
      e.preventDefault(); // ドロップを許可する
      e.dataTransfer.dropEffect = 'move';
      
      const targetItem = e.currentTarget;
      // 現在ドラッグされている要素以外なら、ドラッグオーバーの装飾をつける
      if(draggedIndex !== index) {
          targetItem.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, index) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');

      if (draggedIndex !== null && draggedIndex !== index) {
        // playlist配列の中身を入れ替える
        const itemToMove = playlist.splice(draggedIndex, 1)[0];
        playlist.splice(index, 0, itemToMove);
        
        // 再生中のインデックスも追従させる処理
        if (isPlaylistMode) {
           if (draggedIndex === currentPlaylistIndex) {
              currentPlaylistIndex = index;
           } else if (draggedIndex < currentPlaylistIndex && index >= currentPlaylistIndex) {
              currentPlaylistIndex--;
           } else if (draggedIndex > currentPlaylistIndex && index <= currentPlaylistIndex) {
              currentPlaylistIndex++;
           }
        }
        
        savePlaylist();
        renderPlaylistUI();
      }
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      draggedIndex = null;
      // 全てのdrag-overクラスを削除（保険）
      document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('drag-over'));
    }

    function renderPlaylistUI() {
      const container = document.getElementById('playlistUI');
      const btnStart = document.getElementById('btnStartPlaylist');
      
      if (playlist.length === 0) {
        container.innerHTML = '<li style="color: #aaa; padding: 10px;">リストは空です。検索結果やURLから追加してください。</li>';
        btnStart.style.display = 'none';
        return;
      }

      btnStart.style.display = 'inline-block';
      container.innerHTML = '';
      
      playlist.forEach((item, index) => {
        const isCurrent = (isPlaylistMode && currentPlaylistIndex === index);
        const li = document.createElement('li');
        li.className = `playlist-item ${isCurrent ? 'active' : ''}`;
        
        // ドラッグ＆ドロップ属性の付与
        li.setAttribute('draggable', 'true');
        li.ondragstart = (e) => handleDragStart(e, index);
        li.ondragover = (e) => handleDragOver(e, index);
        li.ondragleave = (e) => handleDragLeave(e);
        li.ondrop = (e) => handleDrop(e, index);
        li.ondragend = (e) => handleDragEnd(e);
        
        const badgeClass = isCurrent ? 'loop-badge active-badge' : 'loop-badge';
        const currentCountDisplay = isCurrent ? `<span style="margin-right: 5px;">${item.currentLoops} /</span>` : '';

        li.innerHTML = `
          <div class="playlist-info" title="${item.title}">
            <span class="drag-handle">≡</span>
            <span>${index + 1}. ${item.title}</span>
          </div>
          <div class="playlist-actions">
            <div class="${badgeClass}">
              🔄 ${currentCountDisplay} 
              <input type="number" class="inline-loop-input" value="${item.targetLoops}" min="1" onchange="updateItemLoop(${index}, this.value)" onclick="event.stopPropagation()"> 回
            </div>
            <button class="btn-secondary btn-small" onclick="playPlaylistItem(${index})">再生</button>
            <button class="btn-secondary btn-small" onclick="removePlaylistItem(${index})">✕</button>
          </div>
        `;
        container.appendChild(li);
      });
    }

    function startPlaylist() {
      if (playlist.length === 0) return;
      isPlaylistMode = true;
      playlist.forEach(item => item.currentLoops = 0);
      currentPlaylistIndex = 0;
      playPlaylistItem(0);
    }

    function playPlaylistItem(index) {
      if (!player || !player.loadVideoById) return;
      isPlaylistMode = true;
      currentPlaylistIndex = index;
      currentVideoId = playlist[index].videoId;
      player.loadVideoById(currentVideoId);
      
      updateCurrentLoopDisplay();
      renderPlaylistUI();
      if(!isMiniPlayer) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function playSingleVideo(videoId) {
      if (!player || !player.loadVideoById) return;
      isPlaylistMode = false;
      currentVideoId = videoId;
      player.loadVideoById(currentVideoId);
      updateCurrentLoopDisplay(true);
      renderPlaylistUI();
      if(!isMiniPlayer) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleInput() {
      const input = document.getElementById('directInput').value.trim();
      if (!input) return;

      const videoId = extractVideoId(input);
      if (videoId) {
        playSingleVideo(videoId);
      } else {
        searchYouTube(input);
      }
    }

    async function searchYouTube(keyword) {
      if (!YOUTUBE_API_KEY) { alert("APIキーが設定されていません。"); return; }
      
      const container = document.getElementById('searchResults');
      const loading = document.getElementById('loadingText');
      container.innerHTML = ''; loading.style.display = 'block';

      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(keyword)}&type=video&key=${YOUTUBE_API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();

        loading.style.display = 'none';
        if (data.error) { container.innerHTML = `<p style="color: #ff5555; grid-column: 1 / -1;">検索エラーが発生しました。</p>`; return; }
        if (data.items.length === 0) { container.innerHTML = `<p style="color: #aaa; grid-column: 1 / -1;">動画が見つかりませんでした。</p>`; return; }

        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const snippet = item.snippet;
          const title = new DOMParser().parseFromString(snippet.title, 'text/html').body.textContent;
          
          const card = document.createElement('div');
          card.className = 'result-item';
          
          card.innerHTML = `
            <img class="result-thumbnail" src="${snippet.thumbnails.medium.url}" alt="thumbnail" style="cursor:pointer;" onclick="playSingleVideo('${videoId}')">
            <div class="result-info">
              <h3 class="result-title" title="${title}">${title}</h3>
              <p style="font-size: 0.75rem; color: #aaa; margin: 0;">${snippet.channelTitle}</p>
            </div>
            <div class="result-actions">
              <button onclick="playSingleVideo('${videoId}')">▶ 単体再生</button>
              <button class="btn-green" onclick="addSearchToPlaylist('${videoId}', '${title.replace(/'/g, "\\'")}')">＋ リスト</button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        loading.style.display = 'none';
        container.innerHTML = `<p style="color: #ff5555; grid-column: 1 / -1;">通信エラーが発生しました。</p>`;
      }
    }

    function addSearchToPlaylist(videoId, title) {
      const loops = parseInt(document.getElementById('listLoopInput').value, 10) || 3; 
      addToPlaylistData(videoId, title, loops);
      
      const notification = document.createElement('div');
      notification.innerText = `「${title}」をリストに追加しました！`;
      notification.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2ea043; color:white; padding:10px 20px; border-radius:8px; z-index:9999;';
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 2500);
    }

    function toggleMiniPlayer() {
      const container = document.getElementById('playerContainer');
      isMiniPlayer = !isMiniPlayer;
      if (isMiniPlayer) {
        container.classList.add('floating');
      } else {
        container.classList.remove('floating');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    document.getElementById('directInput').addEventListener('keypress', e => { if (e.key === 'Enter') handleInput(); });
    document.getElementById('listUrlInput').addEventListener('keypress', e => { if (e.key === 'Enter') addUrlToPlaylist(); });

  </script>
</body>
</html>
